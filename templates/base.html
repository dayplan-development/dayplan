<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DayPlan{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><h1>DayPlan</h1></a>
      <p class="tagline">Plan your day. Own your time.</p>
    </div>
  </header>

  <main class="container page">
    {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="stat" role="status">
      <span>{% if category == 'success' %}<strong>Success:</strong> {% endif %}{{ message }}</span>
    </div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
