<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DayPlan{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/"><h1>DayPlan</h1></a>
      <p class="tagline">Plan your day. Own your time.</p>
    </div>
  </header>

  <main class="container page" tabindex="-1">
    {% set messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    <div class="visually-hidden" role="status" aria-live="polite" aria-atomic="true" data-flash-polite></div>
    <div class="visually-hidden" role="alert" aria-live="assertive" aria-atomic="true" data-flash-assertive></div>
    <div class="flash-stack" data-flash-stack>
      {% for category, message in messages %}
      <div class="flash flash-{{ category }}" data-flash-category="{{ category }}">
        <p class="flash-message">
          {% if category == 'success' %}<strong>Success:</strong> {% endif %}{{ message }}
        </p>
        <button class="flash-close" type="button" aria-label="Dismiss notification" hidden>&times;</button>
      </div>
      {% endfor %}
    </div>
    <script src="{{ url_for('static', filename='js/notifications.js') }}" defer></script>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
