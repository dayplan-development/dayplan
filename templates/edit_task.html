{% extends "base.html" %}
{% block content %}
<h1>Edit task</h1>
{% for name, message in errors.items() %}<p role="alert">{{ name }}: {{ message }}</p>{% endfor %}
<form method="post" action="{{ url_for('update_task', task_id=task.id, **query_filters) }}">
  <label>Title <input name="title" maxlength="100" required value="{{ form_values.title }}"></label>
  <label>Description <textarea name="description" maxlength="500">{{ form_values.description }}</textarea></label>
  <label>Due date <input type="date" name="due_date" value="{{ form_values.due_date }}"></label>
  <label>Priority <select name="priority">{% for value in ("Low", "Medium", "High") %}<option{% if form_values.priority == value %} selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>
  <button type="submit">Save changes</button>
</form>
<a href="{{ url_for('dashboard', **query_filters) }}">Cancel</a>
{% endblock %}
